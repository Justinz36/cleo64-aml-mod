name: Build CLEO64 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android command line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Find Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          find "$ANDROID_SDK_ROOT/ndk" -maxdepth 2 -type d -print

      - name: Configure ARM64 build
        run: |
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.3.11579264/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Compile
        run: |
          cmake --build build-arm64 --config Release --parallel 2

      - name: Verify output
        run: |
          find build-arm64 -type f -name "*.so" -print
          file build-arm64/out/libcleo64.so
          readelf -h build-arm64/out/libcleo64.so | grep -E "Class|Machine"

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: cleo64-arm64
          path: build-arm64/out/libcleo64.so
          if-no-files-found: error
