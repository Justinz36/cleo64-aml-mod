name: Build Diagnostic AML_ImGui and CLEO64 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout CLEO64
        uses: actions/checkout@v4

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find \
              "$ANDROID_SDK_ROOT/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | head -n 1)"
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses > /dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-21"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "cmake;3.22.1"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;$NDK_VERSION"

      - name: Set Android NDK path
        shell: bash
        run: |
          set -e

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

          test -d "$NDK_DIR"
          test -x "$NDK_DIR/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_BUILD=$NDK_DIR/ndk-build" >> "$GITHUB_ENV"

      - name: Download AndroidModLoader source
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/RusJJ/AndroidModLoader.git \
            aml-src

          test -f aml-src/template_of_mod/mod/amlmod.h
          test -f aml-src/template_of_mod/mod/logger.h
          test -f aml-src/template_of_mod/mod/logger.cpp
          test -f aml-src/template_of_mod/mod/interface.h

      - name: Prepare AML headers
        shell: bash
        run: |
          set -e

          mkdir -p aml-include

          cp -R \
            aml-src/template_of_mod/mod \
            aml-include/

          test -f aml-include/mod/amlmod.h
          test -f aml-include/mod/logger.h
          test -f aml-include/mod/logger.cpp
          test -f aml-include/mod/interface.h

      - name: Download AML_ImGui with submodules
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/AndroidModLoader/AML_ImGui.git \
            imgui-src

          cd imgui-src
          git submodule update --init --recursive
          cd ..

          test -f imgui-src/Android.mk
          test -f imgui-src/main.cpp
          test -f imgui-src/main.h
          test -f imgui-src/iimgui.cpp
          test -f imgui-src/iimgui.h
          test -f imgui-src/imgui.cpp
          test -f imgui-src/imgui_draw.cpp
          test -f imgui-src/imgui_tables.cpp
          test -f imgui-src/imgui_widgets.cpp
          test -f imgui-src/backends/imgui_impl_renderware.cpp
          test -f imgui-src/RW/RenderWare.cpp
          test -f imgui-src/stb/stb_sprintf.h

      - name: Prepare AML_ImGui dependencies
        shell: bash
        run: |
          set -e

          cp -R \
            aml-src/template_of_mod/mod \
            imgui-src/mod

          test -f imgui-src/mod/logger.cpp
          test -f imgui-src/mod/logger.h
          test -f imgui-src/stb/stb_sprintf.h

          cat > imgui-src/Application.mk <<'EOF'
          APP_STL := c++_static
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-21
          APP_CPPFLAGS += -std=c++17
          EOF

          echo "=== AML_ImGui Application.mk ==="
          cat imgui-src/Application.mk

      - name: Disable incompatible AML_ImGui hooks
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("imgui-src/main.cpp")
          text = path.read_text()

          marker = 'extern "C" void OnModLoad()'
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "Could not find AML_ImGui OnModLoad function"
              )

          diagnostic_load = r'''
          extern "C" void OnModLoad()
          {
              logger->Info(
                  "Dear ImGui diagnostic provider loaded"
              );

              logger->Info(
                  "All GTA hardcoded hooks are disabled"
              );

              logger->Info(
                  "RenderWare hook: disabled"
              );

              logger->Info(
                  "Touch hook: disabled"
              );

              logger->Info(
                  "Keyboard hook: disabled"
              );
          }
          '''

          path.write_text(
              text[:start] + diagnostic_load
          )
          PY

          grep -A25 -B3 \
            'extern "C" void OnModLoad' \
            imgui-src/main.cpp

      - name: Build diagnostic AML_ImGui ARM64
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/aml-imgui

          "$NDK_BUILD" \
            -C imgui-src \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-21 \
            NDK_OUT="$GITHUB_WORKSPACE/ndk-out-imgui" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/artifacts/aml-imgui" \
            V=1

          test -f \
            artifacts/aml-imgui/arm64-v8a/libDearImGui.so

      - name: Copy AML_ImGui interface header
        shell: bash
        run: |
          set -e

          mkdir -p aml-include/imgui

          cp \
            imgui-src/iimgui.h \
            aml-include/imgui/iimgui.h

          test -f aml-include/imgui/iimgui.h

      - name: Check CLEO64 project files
        shell: bash
        run: |
          set -e

          test -f CMakeLists.txt
          test -f src/main.cpp
          test -f aml-include/mod/amlmod.h
          test -f aml-include/mod/logger.h
          test -f aml-include/mod/logger.cpp
          test -f aml-include/mod/interface.h
          test -f aml-include/imgui/iimgui.h

      - name: Configure CLEO64 ARM64
        shell: bash
        run: |
          set -e

          cmake -S . \
            -B build-cleo64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Build CLEO64 ARM64
        shell: bash
        run: |
          set -e

          cmake --build build-cleo64 \
            --config Release \
            --parallel 2

          test -f build-cleo64/out/libcleo64.so

          mkdir -p artifacts/cleo64

          cp \
            build-cleo64/out/libcleo64.so \
            artifacts/cleo64/libcleo64.so

      - name: Verify ARM64 libraries
        shell: bash
        run: |
          set -e

          echo "=== Verify diagnostic AML_ImGui ==="

          file \
            artifacts/aml-imgui/arm64-v8a/libDearImGui.so

          readelf -h \
            artifacts/aml-imgui/arm64-v8a/libDearImGui.so \
            | grep -E "Class|Machine"

          echo "=== Verify CLEO64 ==="

          file \
            artifacts/cleo64/libcleo64.so

          readelf -h \
            artifacts/cleo64/libcleo64.so \
            | grep -E "Class|Machine"

      - name: Prepare diagnostic package
        shell: bash
        run: |
          set -e

          mkdir -p final-package

          cp \
            artifacts/aml-imgui/arm64-v8a/libDearImGui.so \
            final-package/libDearImGui.so

          cp \
            artifacts/cleo64/libcleo64.so \
            final-package/libcleo64.so

          cat > final-package/README.txt <<'EOF'
          GTA SA Android ARM64 diagnostic package

          Target ABI: arm64-v8a

          Files:
          - libDearImGui.so
          - libcleo64.so

          Important:
          This is a diagnostic AML_ImGui build.
          GTA hardcoded RenderWare, touch, and keyboard hooks
          are disabled.

          Install both .so files into:
          Android_unprotected/data/com.rockstargames.gtasa/files/mods/

          This diagnostic build is intended to verify that the
          provider loads without crashing. It does not display
          the ImGui menu yet.
          EOF

          find final-package \
            -type f \
            -printf '%P %s bytes\n'

      - name: Upload combined diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: gta-sa-arm64-diagnostic-imgui-cleo64
          path: final-package
          if-no-files-found: error

      - name: Upload diagnostic AML_ImGui separately
        uses: actions/upload-artifact@v4
        with:
          name: aml-imgui-arm64-diagnostic
          path: artifacts/aml-imgui/arm64-v8a/libDearImGui.so
          if-no-files-found: error

      - name: Upload CLEO64 separately
        uses: actions/upload-artifact@v4
        with:
          name: cleo64-arm64-imgui-consumer
          path: artifacts/cleo64/libcleo64.so
          if-no-files-found: error
concurrency:
