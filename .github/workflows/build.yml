name: Build CLEO64 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-21" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Configure ARM64 build
        run: |
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_NDK="$ANDROID_NDK_HOME"

      - name: Compile
        run: cmake --build build-arm64 --config Release --parallel 2

      - name: Verify output
        run: |
          ls -l build-arm64/out
          file build-arm64/out/libcleo64.so

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: cleo64-arm64
          path: build-arm64/out/libcleo64.so
          if-no-files-found: error
