name: Build CLEO64 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download AML source
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml-src
          test -d aml-src/include

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi

          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install required Android packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses > /dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-21"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "cmake;3.22.1"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;26.3.11579264"

      - name: Set Android NDK path
        shell: bash
        run: |
          set -e

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/26.3.11579264"

          test -d "$NDK_DIR"

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK found at: $NDK_DIR"

      - name: Configure ARM64 build
        shell: bash
        run: |
          set -e

          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Compile
        shell: bash
        run: |
          set -e
          cmake --build build-arm64 \
            --config Release \
            --parallel 2

      - name: Verify ARM64 output
        shell: bash
        run: |
          set -e

          find build-arm64 -type f -name "*.so" -print

          test -f build-arm64/out/libcleo64.so

          file build-arm64/out/libcleo64.so

          readelf -h build-arm64/out/libcleo64.so \
            | grep -E "Class|Machine"

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: cleo64-arm64
          path: build-arm64/out/libcleo64.so
          if-no-files-found: error
